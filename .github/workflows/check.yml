name: Check research app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run ci
      - run: npm run build:pages
      - run: node scripts/check-pages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-pages-demo
          path: dist/pages

  transcription-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - run: python -m unittest discover -s services/transcription -p 'test_*.py'
