name: Publish synthetic Pages demo
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to publish
        type: choice
        default: web
        options:
          - web
          - legacy
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ inputs.app == 'web' && 'web/package-lock.json' || 'package-lock.json' }}
      - uses: actions/configure-pages@v5
        id: pages
      # Rebuilt app (Vite 8 + TanStack Router), browser-local storage.
      - if: inputs.app == 'web'
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      # Original app's static demo.
      - if: inputs.app == 'legacy'
        run: |
          npm ci
          npm run build
          npm run ci
          npm run build:pages
          node scripts/check-pages.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.app == 'web' && 'web/dist' || 'dist/pages' }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
